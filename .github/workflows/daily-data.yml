name: Daily verified data pipeline

on:
  schedule:
    - cron: "5 0 * * *" # 08:05 Asia/Taipei, 00:05 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: governed-data-writer
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test source failover contracts
        run: python scripts/test_source_failover.py

      - name: Test four-horizon analysis contracts
        run: python scripts/test_timescale_intelligence.py

      - name: Collect daily data
        env:
          SEC_USER_AGENT: "mstr-btc-bottom-report/1.0 hsin73@realtek.com"
        run: python scripts/daily_data_pipeline.py

      - name: Collect cross-asset market universe
        run: python scripts/collect_market_universe.py

      - name: Independently verify current market universe
        run: python scripts/verify_market_universe.py

      - name: Prove market evidence ledger fails closed
        run: python scripts/test_market_evidence_mutations.py

      - name: Collect macro, policy, equity, and on-chain context
        run: python scripts/collect_market_context.py

      - name: Independently verify cross-market context
        run: python scripts/verify_market_context.py

      - name: Prove context verifier rejects date and independence mutations
        run: python scripts/test_market_context_mutations.py

      - name: Collect dual-source completed price history
        run: python scripts/collect_timescale_data.py

      - name: Verify multi-source price history
        run: python scripts/verify_timescale_data.py

      - name: Verify with independent data agent
        continue-on-error: true
        run: |
          rm -f data/daily/agent_verification_report.json
          python scripts/verify_daily_data.py

      - name: Enforce verifier artifact freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("data/daily/latest_snapshot.json").read_text(encoding="utf-8-sig"))
          market = json.loads(Path("data/daily/market_universe.json").read_text(encoding="utf-8-sig"))
          report = json.loads(Path("data/daily/agent_verification_report.json").read_text(encoding="utf-8-sig"))
          if report.get("date") != snapshot.get("date"):
              raise SystemExit("Verifier report is missing or stale for the current snapshot")
          if report.get("snapshot_generated_at") != snapshot.get("generated_at"):
              raise SystemExit("Verifier report is not bound to the current snapshot")
          if report.get("batch_id") != snapshot.get("batch_id"):
              raise SystemExit("Verifier report is not bound to the current source batch")
          if report.get("market_universe_generated_at") != market.get("generated_at"):
              raise SystemExit("Verifier report is not bound to the current market universe")
          if report.get("status") not in {"pass", "degraded", "fail"}:
              raise SystemExit("Verifier report has an unknown status")
          if report.get("status_scope") != "verified_market_inputs_only":
              raise SystemExit("Verifier main status scope is invalid")
          structural = report.get("structural_context_quality", {})
          if structural.get("status") not in {"pass", "degraded", "fail"}:
              raise SystemExit("Structural-context verification is missing")
          if structural.get("execution_gate_eligible") is not False:
              raise SystemExit("Structural context must never control execution gates")
          if structural.get("scope") != "structural_context_only":
              raise SystemExit("Structural-context scope is invalid")
          print(f"Verifier artifact current: {report['date']} status={report['status']}")
          PY

      - name: Compile guarded Wiki context
        run: python scripts/build_knowledge_context.py

      - name: Generate four-horizon market intelligence
        run: python scripts/generate_timescale_intelligence.py

      - name: Verify four-horizon math, lineage, and scope
        run: python scripts/verify_timescale_intelligence.py

      - name: Generate eight-desk market editorial
        run: python scripts/generate_market_editorial.py

      - name: Verify editorial values, hashes, history, and scope
        run: python scripts/verify_market_editorial.py

      - name: Prove editorial verifier rejects mutations
        run: |
          python scripts/test_market_editorial.py
          python scripts/test_market_editorial_mutations.py

      - name: Validate analysis-only publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          analysis = json.loads(Path("data/daily/timescale_intelligence.json").read_text(encoding="utf-8-sig"))
          analysis_verification = json.loads(Path("data/daily/timescale_intelligence_verification.json").read_text(encoding="utf-8-sig"))
          history = json.loads(Path("data/daily/timescale_intelligence_history.json").read_text(encoding="utf-8-sig"))
          context = json.loads(Path("data/daily/knowledge_context.json").read_text(encoding="utf-8-sig"))
          snapshot = json.loads(Path("data/daily/latest_snapshot.json").read_text(encoding="utf-8-sig"))
          market_editorial = json.loads(Path("data/daily/market_editorial.json").read_text(encoding="utf-8-sig"))
          market_editorial_verification = json.loads(Path("data/daily/market_editorial_verification.json").read_text(encoding="utf-8-sig"))
          if analysis.get("snapshot_generated_at") != snapshot.get("generated_at"):
              raise SystemExit("Four-horizon analysis is not bound to the current snapshot")
          if analysis_verification.get("analysis_generated_at") != analysis.get("generated_at") or analysis_verification.get("status") != "pass":
              raise SystemExit("Four-horizon analysis verification is missing or failed")
          if analysis.get("quality", {}).get("execution_gate_eligible") is not False:
              raise SystemExit("Research analysis must never be execution-gate eligible")
          mode = analysis.get("quality", {}).get("publication_mode")
          if mode not in {"analysis_only", "diagnostics_only"}:
              raise SystemExit("Four-horizon publication mode is invalid")
          if mode == "analysis_only" and set(analysis.get("horizons", {})) != {"daily", "weekly", "monthly", "quarterly"}:
              raise SystemExit("Analysis-only publication does not contain all four horizons")
          if mode == "diagnostics_only" and (analysis.get("horizons") or analysis.get("exclusive_insights")):
              raise SystemExit("Diagnostics-only publication exposes conclusions")
          if not history.get("items") or history["items"][-1].get("generated_at") != analysis.get("generated_at"):
              raise SystemExit("Append-only history is not bound to the current analysis")
          required_page_keys = {"slug", "title", "confidence", "last_verified", "quality_flags", "analysis_use", "decision_inputs"}
          if any(not required_page_keys.issubset(page) for page in context.get("pages", [])):
              raise SystemExit("Knowledge context contract is incomplete")
          if market_editorial_verification.get("source_generated_at") != market_editorial.get("generated_at") or market_editorial_verification.get("source_hash") != market_editorial.get("editorial_hash"):
              raise SystemExit("Market editorial verifier is not bound to the complete current artifact")
          if market_editorial_verification.get("status") != "pass" or market_editorial.get("quality", {}).get("execution_gate_eligible") is not False:
              raise SystemExit("Market editorial verification or analysis-only scope failed")
          if market_editorial.get("quality", {}).get("publication_mode") == "analysis_only" and len(market_editorial.get("desks", [])) != 8:
              raise SystemExit("Market editorial does not contain all eight research desks")
          print(f"Analysis-only publication validated: mode={mode} horizons={len(analysis.get('horizons', {}))} knowledge_pages={len(context.get('pages', []))}")
          PY

      - name: Audit product surfaces and publish fail-closed diagnostics
        run: python scripts/audit_product_surfaces.py --allow-fail-closed-data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/*.json
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "Update verified daily data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

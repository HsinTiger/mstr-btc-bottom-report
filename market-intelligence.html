  <style>
  :root{--bg:#080a0d;--panel:#11151b;--panel2:#171c23;--text:#f5f2e9;--muted:#9aa4b2;--line:#2a313c;--amber:#f4b942;--cyan:#50d3d8;--red:#ff6b6b;--green:#78d6a0;--serif:Georgia,"Noto Serif TC",serif;--sans:Inter,"Noto Sans TC",system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
  *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:radial-gradient(circle at 80% -10%,#17313b 0,transparent 32rem),var(--bg);color:var(--text);font-family:var(--sans)}a{color:inherit}.shell{width:min(1240px,calc(100% - 30px));margin:auto}.mast{padding:22px 0 18px;border-bottom:1px solid var(--line)}.mast-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px}.kicker{color:var(--amber);font:900 .73rem/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase}.mast h1{margin:6px 0 4px;font:900 clamp(2.25rem,6vw,5.4rem)/.88 var(--serif);letter-spacing:-.065em}.mast p{max-width:860px;margin:0;color:#c7cbd1;font-size:.94rem;line-height:1.7}.stamp{text-align:right;color:var(--muted);font:700 .72rem/1.55 var(--mono)}.nav{display:flex;gap:7px;margin-top:18px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.nav a{flex:0 0 auto;padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:#cbd0d7;text-decoration:none;font-size:.76rem;font-weight:800}.nav a:hover,.nav a.active{border-color:var(--amber);background:var(--amber);color:#111}.quality{margin-top:12px;padding:10px 12px;border-left:4px solid var(--cyan);background:#101b20;color:#c6e7e8;font:700 .75rem/1.55 var(--mono)}.quality.warn{border-color:var(--amber);background:#241d0f;color:#f8dda4}.quality.bad{border-color:var(--red);background:#2a1114;color:#ffc6c6}.jump{display:flex;gap:8px;margin:16px 0;overflow-x:auto}.jump a{flex:0 0 auto;color:var(--muted);font-size:.75rem;text-decoration:none;border-bottom:1px solid var(--line);padding:5px 1px}.jump a:hover{color:var(--text);border-color:var(--amber)}.lead{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.65fr);gap:0;border:1px solid var(--line);background:var(--panel);box-shadow:0 26px 80px #0008}.lead-main{padding:clamp(24px,5vw,58px);border-top:6px solid var(--amber)}.lead-side{padding:28px;background:#ece6d8;color:#171717}.eyebrow{color:var(--amber);font:900 .72rem/1.3 var(--mono);letter-spacing:.1em}.lead h2{max-width:850px;margin:14px 0 15px;font:900 clamp(2.1rem,5vw,4.6rem)/.98 var(--serif);letter-spacing:-.055em}.lead-conclusion{max-width:900px;margin:0;color:#dce1e7;font:650 clamp(1rem,1.8vw,1.24rem)/1.65 var(--serif)}.lead-change{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}.lead-change b{color:var(--cyan)}.lead-side .label{color:#6c665c;font:900 .68rem/1.2 var(--mono);letter-spacing:.08em}.lead-side h3{margin:9px 0 18px;font:900 1.5rem/1.12 var(--serif)}.lead-side p{margin:0 0 18px;font-size:.84rem;line-height:1.65}.lead-side .falsifier{padding-top:16px;border-top:1px solid #b9b1a3}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 28px}.metric{min-width:0;padding:16px;border:1px solid var(--line);background:linear-gradient(145deg,#141920,#0f1217)}.metric .label{color:var(--muted);font:800 .68rem/1.3 var(--mono)}.metric strong{display:block;margin:8px 0 6px;font:900 clamp(1.45rem,3vw,2.3rem)/1 var(--serif);overflow-wrap:anywhere}.metric p{margin:0;color:#b9c0ca;font-size:.74rem;line-height:1.5}.section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:32px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}.section-title h2{margin:0;font:900 clamp(1.7rem,3.8vw,3rem)/1 var(--serif)}.section-title p{margin:0;color:var(--muted);font-size:.76rem}.desk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.desk{min-width:0;padding:22px;border:1px solid var(--line);background:var(--panel);scroll-margin-top:12px}.desk.pass{border-top:4px solid var(--cyan)}.desk.degraded{border-top:4px solid var(--amber)}.desk-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.desk-tag{color:var(--amber);font:900 .68rem/1.3 var(--mono);letter-spacing:.08em}.state{flex:0 0 auto;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:#c8ced6;font:800 .65rem/1.2 var(--mono)}.desk h3{margin:10px 0 8px;font:900 clamp(1.4rem,2.7vw,2.05rem)/1.06 var(--serif);letter-spacing:-.03em}.desk .conclusion{margin:0;color:#d4d9df;font-size:.86rem;line-height:1.65}.evidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:16px}.evidence{min-width:0;padding:12px;background:var(--panel2);border:1px solid #252c35}.evidence .name{min-height:2.5em;color:var(--muted);font-size:.68rem;font-weight:800;line-height:1.25}.evidence strong{display:block;margin:7px 0 5px;color:var(--text);font:900 clamp(1.15rem,2.2vw,1.7rem)/1 var(--mono);letter-spacing:-.045em;overflow-wrap:anywhere}.evidence .change{color:var(--cyan);font-size:.66rem;line-height:1.35}.evidence .read{margin-top:8px;color:#aeb6c1;font-size:.67rem;line-height:1.45}.evidence time{display:block;margin-top:8px;color:#697484;font:700 .6rem/1.3 var(--mono)}details.analysis{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}details.analysis summary{cursor:pointer;color:var(--amber);font-size:.75rem;font-weight:900;list-style:none}details.analysis summary::-webkit-details-marker{display:none}.argument-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.argument{padding:12px;background:#0c1015}.argument b{display:block;margin-bottom:5px;color:var(--green);font:900 .68rem/1.3 var(--mono)}.argument p{margin:0;color:#bec5ce;font-size:.74rem;line-height:1.55}.argument.variant b{color:var(--amber)}.falsifier-row{margin-top:8px;padding:12px;border-left:3px solid var(--red);background:#201013;color:#e6c4c7;font-size:.73rem;line-height:1.55}.sources{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.sources a{color:#9fabb9;font-size:.65rem;text-decoration:none;border-bottom:1px solid #45505e}.sources a:hover{color:var(--cyan)}.hidden{display:none!important}.diagnostic{padding:34px;border:1px solid #6a252c;background:#281014;color:#ffd5d8}.diagnostic h2{margin:0 0 10px;font:900 2rem/1 var(--serif)}.diagnostic p{margin:0;color:#efbfc4;line-height:1.6}.foot{margin:34px 0 22px;padding-top:14px;border-top:1px solid var(--line);color:#747e8b;font-size:.7rem;line-height:1.55}
  @media(max-width:900px){.lead{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.desk-grid{grid-template-columns:1fr}.mast-top{grid-template-columns:1fr}.stamp{text-align:left}.lead-side{padding:22px}.evidence-grid{grid-template-columns:repeat(3,minmax(120px,1fr));overflow-x:auto;padding-bottom:5px}.evidence{min-width:120px}}
  @media(max-width:600px){.shell{width:calc(100% - 18px)}.mast{padding-top:12px}.mast h1{font-size:3.2rem}.mast p{font-size:.86rem}.nav{margin-top:13px}.nav a{padding:7px 9px;font-size:.71rem}.jump{margin:11px 0}.lead-main{padding:21px 17px}.lead h2{font-size:2.35rem}.lead-side{padding:18px}.summary{gap:7px}.metric{padding:13px}.metric strong{font-size:1.45rem}.section-title{display:block}.section-title p{margin-top:7px}.desk{padding:17px}.argument-grid{grid-template-columns:1fr}.evidence-grid{margin-left:-1px;margin-right:-1px}.lead-change{font-size:.74rem}}
  </style>
</head>
<body data-render-status="loading" data-conclusions-visible="false" data-execution-grade="false" data-desk-count="0" data-lead-visible="false">
  <header class="mast"><div class="shell">
    <div class="mast-top"><div><div class="kicker">Daily Cross-Market Editorial</div><h1>市場總編</h1><p><b>本專區回答：</b>今天真正主導 BTC／ETH 的，是價格與籌碼、機構流向、政策、鏈上，還是美元流動性、信用與美股？先看結論，再看三維以上證據與反證。</p></div><div class="stamp" id="stamp">載入研究批次…</div></div>
    <nav class="nav" aria-label="全站主要專區"><a href="index.html">四週期總覽</a><a href="market-intelligence.html" class="active" aria-current="page">市場總編</a><a href="market-monitor.html">即時市場</a><a href="analytics.html">週期分析</a><a href="dashboard.html">時序研究</a><a href="daily-extensions.html">洞察日誌</a><a href="x-intelligence.html">AI 情報</a><a href="wiki.html">知識庫</a><a href="site-overview.html">系統治理</a></nav>
    <div class="quality" id="quality">驗證市場、宏觀、政策與鏈上資料…</div>
  </div></header>
  <main class="shell">
    <nav class="jump" id="jump" aria-label="研究桌快速跳轉"></nav>
    <section class="diagnostic hidden" id="diagnostic"><h2>市場總編已封鎖</h2><p id="diagnosticText"></p></section>
    <section class="lead" id="leadSection"><article class="lead-main" id="leadMain"></article><aside class="lead-side" id="leadSide"></aside></section>
    <section class="summary" id="summary"></section>
    <div class="section-title" id="deskTitle"><h2>八個研究桌</h2><p>每桌至少三個獨立視角；數字保留自己的原始 as_of。</p></div>
    <section class="desk-grid" id="desks"></section>
    <footer class="foot">本頁為研究與風險管理用途，不構成投資建議。所有結論皆為本站確定性研究假說；原始來源只支持所列數據，不背書本站解讀。</footer>
  </main>
<script>
const esc=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
const json=async path=>{const response=await fetch(`${path}?v=${Date.now()}`,{cache:"no-store"});if(!response.ok)throw new Error(`${path} HTTP ${response.status}`);return response.json()};
const localTime=value=>new Date(value).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false});
function fresh(value,hours,label){const age=(Date.now()-Date.parse(value))/36e5;if(!Number.isFinite(age)||age<-.5||age>hours)throw new Error(`${label} 已超過 ${hours} 小時新鮮度契約`)}
function links(items){const seen=new Set();return (items||[]).flatMap(item=>item.sources||[]).filter(item=>{const key=`${item.label}|${item.url}`;if(seen.has(key))return false;seen.add(key);return true}).map(item=>`<a href="${esc(item.url)}" ${String(item.url).startsWith("http")?'target="_blank" rel="noreferrer"':''}>${esc(item.label)}</a>`).join("")}
function evidenceCard(item){return `<article class="evidence"><div class="name">${esc(item.full_name)}</div><strong>${esc(item.display)}</strong><div class="change">${esc(item.change)}</div><div class="read">${esc(item.interpretation)}</div><time>資料 ${esc(item.as_of)}｜${esc(item.source_count)} 來源</time></article>`}
function deskCard(brief){const visible=(brief.evidence||[]).slice(0,3);return `<article class="desk ${esc(brief.status)}" id="${esc(brief.id)}"><div class="desk-head"><div><div class="desk-tag">${esc(brief.title)} · ${esc(brief.confidence)}信心</div><h3>${esc(brief.headline)}</h3></div><span class="state">${esc(brief.resonance.state)}</span></div><p class="conclusion">${esc(brief.conclusion)}</p><div class="evidence-grid">${visible.map(evidenceCard).join("")}</div><details class="analysis"><summary>展開非共識假說、二階影響、完整證據與反證 →</summary><div class="argument-grid"><div class="argument"><b>常見快速解讀</b><p>${esc(brief.common_interpretation)}</p></div><div class="argument variant"><b>本站非共識假說</b><p>${esc(brief.variant_view)}</p></div><div class="argument"><b>二階影響</b><p>${esc(brief.second_order_effect)}</p></div><div class="argument"><b>今天怎麼思考</b><p>${esc(brief.practical_readthrough)}</p></div></div>${brief.evidence.length>3?`<div class="evidence-grid">${brief.evidence.slice(3).map(evidenceCard).join("")}</div>`:""}<div class="falsifier-row"><b>什麼會推翻本站假說：</b>${esc(brief.falsifier)}</div><div class="lead-change"><b>和上一個不同日期相比：</b>${esc(brief.what_changed)}</div><div class="sources">${links(brief.evidence)}${(brief.knowledge_links||[]).map(item=>`<a href="${esc(item.url)}">知識庫：${esc(item.title)}</a>`).join("")}</div></details></article>`}
function render(editorial,verification){const briefs=editorial.desks||[],digest=editorial.editorial_digest||{},lead=briefs.find(item=>item.id===digest.lead_desk_id);if(briefs.length!==8||!lead)throw new Error("八個研究桌或今日主文不完整");const resonance=digest.resonance_summary||{},sourceHealth=digest.source_health||{},policy=briefs.find(item=>item.id==="policy"),policyCount=policy?.evidence?.find(item=>item.metric_id==="policy-events-7d")?.display||"—";document.getElementById("stamp").innerHTML=`資料日 ${esc(editorial.date)}<br>更新 ${esc(localTime(editorial.generated_at))}<br>每日 08:42 台北時間`;const quality=document.getElementById("quality"),degraded=editorial.quality.status==="degraded";quality.className=`quality ${degraded?'warn':''}`;quality.textContent=`市場總編 ${editorial.quality.status.toUpperCase()}｜獨立驗證 ${verification.status.toUpperCase()}｜${sourceHealth.successful||0}/${sourceHealth.total||0} 來源端點可用${sourceHealth.failed_with_fallback?`，${sourceHealth.failed_with_fallback} 個已切備援`:''}｜完整 artifact hash 綁定｜8/8 研究桌｜analysis-only`;document.getElementById("jump").innerHTML=briefs.map(item=>`<a href="#${esc(item.id)}">${esc(item.title)}</a>`).join("");document.getElementById("leadMain").innerHTML=`<div class="eyebrow">${esc(lead.title)} · 今日主文</div><h2>${esc(lead.headline)}</h2><p class="lead-conclusion">${esc(lead.conclusion)}</p><div class="lead-change"><b>和上一個不同日期相比：</b>${esc(lead.what_changed)}</div>`;document.getElementById("leadSide").innerHTML=`<div class="label">本站非共識假說</div><h3>${esc(digest.dominant_tension)}</h3><p>${esc(lead.second_order_effect)}</p><p class="falsifier"><b>反證：</b>${esc(digest.falsifier)}</p>`;document.getElementById("summary").innerHTML=`<article class="metric"><div class="label">今日主導矛盾</div><strong>${esc(lead.title)}</strong><p>${esc(lead.resonance.state)}</p></article><article class="metric"><div class="label">正向／負向共振</div><strong>${esc(resonance.positive||0)}／${esc(resonance.negative||0)}</strong><p>另有 ${esc(resonance.mixed||0)} 桌多維分歧</p></article><article class="metric"><div class="label">七日政策事件</div><strong>${esc(policyCount)} 件</strong><p>文件效力高於消息數量</p></article><article class="metric"><div class="label">今日研究覆蓋</div><strong>8／8</strong><p>價格、流向、政策、鏈上、宏觀完整</p></article>`;document.getElementById("desks").innerHTML=briefs.map(deskCard).join("");document.body.dataset.renderStatus=degraded?"degraded":"pass";document.body.dataset.conclusionsVisible="true";document.body.dataset.executionGrade="false";document.body.dataset.deskCount=String(briefs.length);document.body.dataset.leadVisible="true";measure()}
function failClosed(message){document.getElementById("quality").className="quality bad";document.getElementById("quality").textContent=`市場總編已封鎖：${message}`;document.getElementById("diagnosticText").textContent=`必要資料、完整 hash 或 verifier 未通過；不沿用昨天的結論。原因：${message}`;document.getElementById("diagnostic").classList.remove("hidden");for(const id of ["leadSection","summary","deskTitle","desks","jump"]){document.getElementById(id).classList.add("hidden")}document.body.dataset.renderStatus="fail";document.body.dataset.conclusionsVisible="false";document.body.dataset.executionGrade="false";document.body.dataset.deskCount="0";document.body.dataset.leadVisible="false";measure()}
function measure(){const root=document.documentElement,run=()=>root.dataset.pageOverflow=String(root.scrollWidth>root.clientWidth);requestAnimationFrame(()=>requestAnimationFrame(run));setTimeout(run,150)}
async function main(){try{const[editorial,verification]=await Promise.all([json("data/daily/market_editorial.json"),json("data/daily/market_editorial_verification.json")]);if(editorial.schema!==1||verification.schema!==1)throw new Error("市場總編 schema 不相容");fresh(editorial.generated_at,30,"市場總編");fresh(verification.verified_at,30,"市場總編驗證");if(verification.status!=="pass"||verification.source_generated_at!==editorial.generated_at||verification.source_hash!==editorial.editorial_hash)throw new Error("市場總編完整 artifact hash 未通過獨立驗證");if(!["pass","degraded"].includes(editorial.quality?.status)||editorial.quality?.publication_mode!=="analysis_only"||editorial.quality?.execution_gate_eligible!==false)throw new Error((editorial.quality?.failures||[])[0]||"市場總編發布契約失敗");render(editorial,verification)}catch(error){failClosed(error.message)}}
main();
</script>
